<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>Platformer test</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
      }
      #screen {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #backend {
        position: fixed;
        top: 4px;
        left: 4px;
        z-index: 10;
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font:
          bold 14px/1.4 system-ui,
          sans-serif;
        text-decoration: none;
      }
      #message {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        color: #eee;
        font:
          16px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      #message a {
        color: #8cf;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
