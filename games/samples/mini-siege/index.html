<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>The mini siege</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
      }
      #screen {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: calc(100vh - 40px);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 40px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px;
        overflow-x: auto;
        background: #181818;
        color: #eee;
        font:
          14px/1.2 system-ui,
          sans-serif;
      }
      #bar button {
        flex: none;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid #666;
        border-radius: 4px;
        background: #333;
        color: #fff;
        font: inherit;
      }
      #bar button#launch {
        background: #a80020;
        border-color: #f83800;
      }
      #bar button[hidden] {
        display: none;
      }
      #status {
        flex: 1;
        min-width: 8em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #message {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        color: #eee;
        font:
          16px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <!-- The bar: the mission's launch button while it is offered, then Play or Delegate. -->
    <div id="bar">
      <button id="launch" type="button" hidden>Launch</button>
      <button id="play" type="button" hidden title="Play the mission yourself">Play</button>
      <button id="delegate" type="button" hidden title="Let the captain's people do it">Delegate</button>
      <span id="status"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
