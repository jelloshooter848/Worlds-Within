<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>The mini siege</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
      }
      #screen {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: calc(100vh - 40px);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #message {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        color: #eee;
        font:
          16px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      /* The title screen (Engine 0.16 T9) shows the picture alone: the bar waits for Start. */
      body[data-menu='title'] #bar,
      body[data-menu='title'] #briefing,
      body[data-menu='title'] #result,
      body[data-menu='pause'] #briefing,
      body[data-menu='pause'] #result {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <!-- The bar along the bottom (40 px), the briefing and the result panel are the shell's
         (`mountMissionBar` in engine/core/shell/mission-bar.ts; main.ts mounts them). -->
    <script type="module" src="./main.ts"></script>
  </body>
</html>
