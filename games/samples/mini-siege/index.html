<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>The mini siege</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
      }
      #screen {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: calc(100vh - 40px);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 40px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px;
        overflow-x: auto;
        background: #181818;
        color: #eee;
        font:
          14px/1.2 system-ui,
          sans-serif;
      }
      #bar button {
        flex: none;
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid #666;
        border-radius: 4px;
        background: #333;
        color: #fff;
        font: inherit;
      }
      #bar button.launch {
        background: #a80020;
        border-color: #f83800;
      }
      #launches {
        flex: none;
        display: flex;
        gap: 6px;
      }
      #launches:empty {
        display: none;
      }
      #bar button[hidden] {
        display: none;
      }
      #status {
        flex: 1;
        min-width: 8em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #code {
        flex: none;
        width: 15em;
        min-height: 28px;
        box-sizing: border-box;
        padding: 0 6px;
        border: 1px solid #666;
        border-radius: 4px;
        background: #000;
        color: #fff;
        font:
          13px/1.2 ui-monospace,
          monospace;
        text-transform: uppercase;
        user-select: text;
      }
      #result {
        position: fixed;
        left: 50%;
        top: calc((100vh - 40px) / 2);
        transform: translate(-50%, -50%);
        width: min(26em, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 12px 16px;
        border: 2px solid #f8b800;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.88);
        color: #eee;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      #result[hidden] {
        display: none;
      }
      #result h2 {
        margin: 0 0 6px;
        font-size: 18px;
        color: #f8b800;
      }
      #result ul {
        margin: 4px 0;
        padding-left: 1.2em;
      }
      #result-code {
        display: block;
        margin: 6px 0;
        font:
          18px/1.3 ui-monospace,
          monospace;
        letter-spacing: 1px;
        color: #fff;
        user-select: all;
      }
      #result button {
        min-height: 30px;
        padding: 0 12px;
        border: 1px solid #f8b800;
        border-radius: 4px;
        background: #a80020;
        color: #fff;
        font: inherit;
      }
      #message {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        color: #eee;
        font:
          16px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <!-- An entry's end: its result, the save code and the way on (main.ts fills it). -->
    <div id="result" hidden role="dialog" aria-labelledby="result-title">
      <h2 id="result-title"></h2>
      <ul id="result-lines"></ul>
      <span id="result-code-label"></span>
      <code id="result-code"></code>
      <button id="continue" type="button"></button>
    </div>
    <!-- The bar: a launch button per offered mission (main.ts adds them), then Play or Delegate
         (Decide for a choice without a round), the status, and a save code to resume from. -->
    <div id="bar">
      <span id="launches"></span>
      <button id="play" type="button" hidden title="Play the mission yourself">Play</button>
      <button id="delegate" type="button" hidden title="Let the captain's people do it">Delegate</button>
      <span id="status"></span>
      <button id="stored" type="button" hidden title="Carry on from the campaign this browser saved"></button>
      <input
        id="code"
        type="text"
        placeholder="save code"
        autocomplete="off"
        spellcheck="false"
        aria-label="Save code"
      />
      <button id="resume" type="button" title="Resume the campaign from a save code">Resume</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
