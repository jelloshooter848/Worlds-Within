<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>The mini siege</title>
    <meta name="ww-alternate" content="2D ?backend=canvas2d" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
      }
      #screen {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: calc(100vh - 40px);
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* In 3D (Engine 0.16 F7) the mission flow is in the picture: no bar, the whole window. */
      body[data-backend='three'] #screen {
        height: 100vh;
      }
      /* In 3D the shell's sound control, pause button and the 2D link sit at the bottom centre,
         between the HUD's selected unit and the mission card (or in the letterbox under them). */
      body[data-backend='three'] #ww-volume {
        top: auto;
        right: auto;
        bottom: 4px;
        left: 50%;
        transform: translateX(-50%);
      }
      body[data-backend='three'] #ww-pause {
        top: auto;
        right: auto;
        bottom: 40px;
        left: calc(50% - 48px);
      }
      /* Over a centred mission screen (the briefing, the results), the pause menu and the title,
         whose key hint and footer run along the picture's bottom, the controls sit in the
         bottom-right corner, clear of them (Engine 0.16 F9, gap M41). So too while a hosted round
         shows on the shell's 2D layer (`body[data-round='layer']`, Engine 0.16 polish P7): its
         bar and panel run along the picture's bottom, between the 256 px round's own edges. */
      body[data-backend='three']:is(
          [data-screen='briefing'],
          [data-screen='results'],
          [data-menu='title'],
          [data-menu='pause'],
          [data-round='layer']
        )
        #ww-volume {
        left: auto;
        right: 8px;
        transform: none;
      }
      body[data-backend='three']:is(
          [data-screen='briefing'],
          [data-screen='results'],
          [data-menu='title'],
          [data-menu='pause'],
          [data-round='layer']
        )
        #ww-pause {
        left: auto;
        right: 56px;
      }
      body[data-backend='three']:is(
          [data-screen='briefing'],
          [data-screen='results'],
          [data-menu='title'],
          [data-menu='pause'],
          [data-round='layer']
        )
        #backend {
        left: auto;
        right: 8px;
      }
      /* Over a round the corner is only the picture's side margin (a tenth of its width beside
         the 256 px round), so the controls stand in one narrow column there: the sound button over
         an upright slider, the 2D link and the pause button above them (Engine 0.16 polish P7). */
      body[data-backend='three'][data-round='layer'] #ww-volume {
        right: 4px;
        flex-direction: column;
        padding: 2px;
      }
      body[data-backend='three'][data-round='layer'] #ww-master {
        width: 16px;
        height: 56px;
        writing-mode: vertical-lr;
        direction: rtl;
      }
      body[data-backend='three'][data-round='layer'] #backend {
        right: 4px;
        bottom: 104px;
      }
      body[data-backend='three'][data-round='layer'] #ww-pause {
        right: 4px;
        bottom: 134px;
      }
      #backend {
        position: fixed;
        bottom: 40px;
        left: calc(50% + 4px);
        z-index: 10;
        padding: 2px 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font:
          bold 14px/1.4 system-ui,
          sans-serif;
        text-decoration: none;
      }
      /* In 2D the bar takes the bottom: the link sits over the picture's right edge. */
      body:not([data-backend='three']) #backend {
        bottom: auto;
        left: auto;
        top: 50%;
        right: 4px;
      }
      #message a {
        color: #8cf;
      }
      #message {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        color: #eee;
        font:
          16px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      /* The title screen (Engine 0.16 T9) shows the picture alone: the bar waits for Start. */
      body[data-menu='title'] #bar,
      body[data-menu='title'] #briefing,
      body[data-menu='title'] #result,
      body[data-menu='pause'] #briefing,
      body[data-menu='pause'] #result {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <!-- The toggle to the other backend; the shell sets its label and link (3D by default, 2D). -->
    <a id="backend" href="./?backend=canvas2d">2D</a>
    <!-- In 2D, the bar along the bottom (40 px), the briefing and the result panel are the shell's
         (`mountMissionBar` in engine/core/shell/mission-bar.ts; main.ts mounts them). -->
    <script type="module" src="./main.ts"></script>
  </body>
</html>
