name: CI
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium for the screenshot tests (engine/tools/screenshot.test.ts), which CI requires.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm docs:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
