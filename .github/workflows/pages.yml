name: Pages
# Publishes the launcher and every game to GitHub Pages when a release tag is pushed.
# Only full three-part release tags count (engine-vX.Y.Z, ww-vX.Y.Z); see CLAUDE.md.
on:
  push:
    tags:
      - 'engine-v[0-9]+.[0-9]+.[0-9]+'
      - 'ww-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One deploy at a time; a newer release never cancels one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium for the screenshot tests (engine/tools/screenshot.test.ts), which CI requires.
      - run: pnpm exec playwright install --with-deps chromium
      # The same checks as CI, so nothing is published that CI would reject.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
