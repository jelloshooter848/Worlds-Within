<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Worlds Within debugger (tools only)</title>
    <!-- Served only by `pnpm cli debug` (engine/tools/debugger/server.ts); never part of the Pages build. -->
    <style>
      :root {
        --bg: #f6f6f4;
        --panel: #ffffff;
        --text: #1d1d1b;
        --muted: #6b6b66;
        --line: #d9d9d4;
        --accent: #2457c5;
        --good: #1f7a3a;
        --bad: #b3261e;
        --changed: #fff2b3;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161615;
          --panel: #20201f;
          --text: #e8e8e4;
          --muted: #9a9a94;
          --line: #3a3a37;
          --accent: #7fa6ff;
          --good: #6fcf8a;
          --bad: #ff8a80;
          --changed: #4a4220;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      .muted {
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-top: 8px;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 8px;
      }
      button:disabled {
        opacity: 0.5;
      }
      input[type='number'] {
        width: 6em;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1.2fr);
        gap: 12px;
        padding: 12px 16px;
      }
      @media (max-width: 1000px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        min-width: 0;
        margin-bottom: 12px;
      }
      section h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 6px;
        color: var(--muted);
      }
      canvas {
        image-rendering: pixelated;
        width: 100%;
        max-width: 512px;
        background: #000;
      }
      .mono,
      .tree,
      .list {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .list {
        max-height: 320px;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .list li {
        padding: 1px 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .tree {
        max-height: 640px;
        overflow: auto;
      }
      .tree details {
        margin-left: 12px;
      }
      .tree summary {
        cursor: pointer;
      }
      .tree .leaf {
        margin-left: 24px;
        overflow-wrap: anywhere;
      }
      .changed {
        background: var(--changed);
      }
      .pass {
        color: var(--good);
      }
      .fail {
        color: var(--bad);
      }
      .banner {
        margin-top: 6px;
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid var(--bad);
        color: var(--bad);
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 6px;
      }
      .filters input {
        width: 8em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Worlds Within debugger</h1>
      <div id="summary" class="muted">Loading…</div>
      <div class="controls" id="controls">
        <button id="first" title="Rewind to tick 0">|&lt;</button>
        <button id="back10" title="Back 10 ticks">-10</button>
        <button id="back1" title="Back 1 tick">-1</button>
        <button id="fwd1" title="Forward 1 tick">+1</button>
        <button id="fwd10" title="Forward 10 ticks">+10</button>
        <input id="n" type="number" min="1" value="60" aria-label="Ticks to step" />
        <button id="fwdN">+N</button>
        <input id="to" type="number" min="0" value="0" aria-label="Tick to go to" />
        <button id="goto">Go to tick</button>
        <button id="last" title="Go to the last tick">&gt;|</button>
        <button id="play" hidden>Play from here</button>
        <span class="mono" id="where"></span>
      </div>
      <div id="banner" class="banner" hidden></div>
    </header>
    <main>
      <div>
        <section id="picture-panel" hidden>
          <h2>Picture</h2>
          <canvas id="picture"></canvas>
        </section>
        <section>
          <h2>Checks</h2>
          <ul class="list" id="checks"></ul>
        </section>
        <section>
          <h2>Hashes</h2>
          <ul class="list" id="hashes"></ul>
        </section>
      </div>
      <div>
        <section>
          <h2>State</h2>
          <div class="filters">
            <input id="search" type="search" placeholder="Search paths and values" style="width: 100%" />
          </div>
          <div class="tree" id="tree"></div>
        </section>
        <section>
          <h2>Changed since the previous tick</h2>
          <ul class="list" id="diff"></ul>
        </section>
      </div>
      <div>
        <section>
          <h2>Event log</h2>
          <div class="filters">
            <select id="range" aria-label="Which world ticks">
              <option value="step">This step's world ticks</option>
              <option value="all">Everything kept</option>
              <option value="span">World ticks from-to</option>
            </select>
            <input id="ev-from" type="number" min="0" placeholder="from" />
            <input id="ev-to" type="number" min="0" placeholder="to" />
            <input id="ev-entity" type="number" min="1" placeholder="entity" />
            <input id="ev-cause" placeholder="cause" />
            <input id="ev-component" placeholder="component" />
          </div>
          <div class="muted" id="events-head"></div>
          <ul class="list" id="events"></ul>
        </section>
      </div>
    </main>
    <script type="module" src="./page.ts"></script>
  </body>
</html>
